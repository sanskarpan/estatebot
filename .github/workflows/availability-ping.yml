name: EstateBot Availability Ping

on:
  schedule:
    # Offset from the top of the hour to reduce peak-time scheduler delays.
    - cron: "7/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estatebot-availability-ping
  cancel-in-progress: true

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the public health endpoint
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            https://estatebot-assessment.onrender.com/api/health \
            | python -c 'import json,sys; payload=json.load(sys.stdin); assert payload.get("status") == "ok"'
