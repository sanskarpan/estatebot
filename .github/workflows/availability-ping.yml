name: EstateBot Availability Ping

on:
  schedule:
    # Every 15 minutes, offset from the top of the hour to reduce peak-time delays.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estatebot-availability-ping
  cancel-in-progress: true

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the public health endpoint
        run: |
          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "${RUNNER_TEMP}/estatebot-health.json" \
            https://estatebot-assessment.onrender.com/api/health

          python - "${RUNNER_TEMP}/estatebot-health.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("status") == "ok", payload
          records = payload.get("corpus", {}).get("listings_total", 0)
          assert records > 0, payload
          print(f"EstateBot ready: {records} records; uptime={payload.get('uptime_seconds')}s")
          PY
